<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光自习室 · 管理工作台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">拾</div><div><strong>拾光自习室</strong><span>ROOM OPERATIONS</span></div></div>
      <div class="workspace-label">工作空间</div>
      <nav class="main-nav">
        <button class="nav-item active" data-view="overview"><i data-lucide="layout-dashboard"></i><span>运营总览</span></button>
        <button class="nav-item" data-view="bookings"><i data-lucide="calendar-check-2"></i><span>预约管理</span><b id="booking-badge">4</b></button>
        <button class="nav-item" data-view="seats"><i data-lucide="armchair"></i><span>座位资源</span></button>
        <button class="nav-item" data-view="users"><i data-lucide="users"></i><span>用户管理</span></button>
        <button class="nav-item" data-view="complaints"><i data-lucide="message-square-more"></i><span>投诉与反馈</span><b id="complaint-badge">2</b></button>
        <button class="nav-item" data-view="violations"><i data-lucide="shield-alert"></i><span>违规记录</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="help-link"><i data-lucide="circle-help"></i><span>帮助与支持</span></div><div class="profile-mini"><div class="avatar avatar-orange">林</div><div><strong>林管理员</strong><span>超级管理员</span></div><i data-lucide="more-horizontal"></i></div></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb"><span>管理工作台</span><i data-lucide="chevron-right"></i><strong id="page-title">运营总览</strong></div><div class="top-actions"><span class="live-status"><em></em>数据实时同步</span><span class="sync-time" id="sync-time">刚刚更新</span><button class="icon-btn" title="通知"><i data-lucide="bell"></i><b></b></button><div class="avatar avatar-purple">林</div></div></header>
      <div class="page-container" id="app-content"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
